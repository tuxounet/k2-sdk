- name: prepare folders
  file:
    path: "{{ "{{" }} item {{ "}}" }}"
    state: directory

    recurse: yes
  with_items:
    - "{{ "{{" }} run_dir {{ "}}" }}/home/.kube"
    - "{{ "{{" }} run_dir {{ "}}" }}/var/k3s"


- name: create docker network for k3s
  community.docker.docker_network:
    name: network_{{ .kubecontext }}
    state: present
    ipam_config: {{ toRawJson .kubeNetworks }}
     

- name: start embedded k8s node
  community.docker.docker_container:
    state: started
    name: "{{ .kubecontext }}"
    image: "{{ .kubeImage }}"
    env:
      TZ: "Europe/Paris"
      K3S_TOKEN: "a_random_token"
      K3S_KUBECONFIG_OUTPUT: "/config/config"
      K3S_KUBECONFIG_MODE: "666"
    command:
      - server
      - --https-listen-port={{ .kubeApiPort }}
      - --node-name=single-node
      - --disable-cloud-controller
      - --prefer-bundled-bin
    privileged: yes
    user: root
    volumes:
      - "{{ "{{" }} run_dir {{ "}}" }}/var/k3s:/var/lib/rancher/k3s"
      - "{{ "{{" }} run_dir {{ "}}" }}/home/.kube:/config"
    ports:
      - "0.0.0.0:{{ .kubeApiPort }}:{{ .kubeApiPort }}/tcp"
    networks:
      - name: network_{{ .kubecontext }}
    healthcheck:
      test: ["CMD", "kubectl", "get", "nodes"]