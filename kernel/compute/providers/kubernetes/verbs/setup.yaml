- name: prepare folders
  file:
    path: '{{ "{{" }} item {{ "}}" }}'
    state: directory
    recurse: yes
  with_items:
    - '{{ "{{" }} run_dir {{ "}}" }}/bin'
    - '{{ "{{" }} run_dir {{ "}}" }}/home/.kube'
    - '{{ "{{" }} run_dir {{ "}}" }}/etc/compute/kubernetes'
    - '{{ "{{" }} run_dir {{ "}}" }}/var/kubernetes/control-plane'
    - '{{ "{{" }} run_dir {{ "}}" }}/var/kubernetes/worker'

- name: get local arch
  shell:
    cmd: "uname -m"
  register: local_arch

- ansible.builtin.set_fact:
    version_arch: '{{ "{{" }} (local_arch.stdout == "x86_64") | ternary( "amd64",  "arm64") {{ "}}" }}'

- name: download kind binary
  ansible.builtin.get_url:
    url: https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-{{ "{{" }} version_arch {{ "}}" }}
    dest: '{{ "{{" }} run_dir {{ "}}/bin/kind" }}'
    mode: "0755"
  register: kind_download

- name: setup cluster config file
  copy:
    dest: '{{ "{{" }} run_dir {{ "}}" }}/etc/compute/kubernetes/cluster.yaml'
    content: |
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      name: {{ "{{" }} kernel.name | lower {{ "}}" }}
      nodes:
      - role: control-plane
        extraMounts:
          - hostPath: {{ "{{" }} run_dir {{ "}}" }}/var/kubernetes/control-plane
            containerPath: /srv       
      - role: worker
        extraMounts:
          - hostPath: {{ "{{" }} run_dir {{ "}}" }}/var/kubernetes/worker
            containerPath: /srv
        extraPortMappings:
        - containerPort: {{ "{{" }} host.compute.kubernetes.embedded.ports.http {{ "}}" }}
          hostPort: {{ "{{" }} host.compute.kubernetes.embedded.ports.http {{ "}}" }}
          listenAddress: "{{ "{{" }} host.address {{ "}}" }}"
          protocol: TCP
        - containerPort: {{ "{{" }} host.compute.kubernetes.embedded.ports.https {{ "}}" }}
          hostPort: {{ "{{" }} host.compute.kubernetes.embedded.ports.https {{ "}}" }}
          listenAddress: "{{ "{{" }} host.address {{ "}}" }}"
          protocol: TCP
  register: cluster_config

- name: list present kind clusters
  shell:
    cmd: "../bin/kind get clusters"
    chdir: '{{ "{{" }} run_dir {{ "}}" }}/home'
  register: kind_clusters

- name: nuke previous kind cluster
  shell:
    cmd: '../bin/kind delete cluster --name {{ "{{" }} kernel.name | lower {{ "}}" }}'
    chdir: '{{ "{{" }} run_dir {{ "}}" }}/home'
  when: '"{{ "{{" }} kernel.name | lower {{ "}}" }}" in kind_clusters.stdout_lines'

- name: create kind cluster
  shell:
    cmd: "../bin/kind create cluster --config ../etc/compute/kubernetes/cluster.yaml"
    chdir: '{{ "{{" }} run_dir {{ "}}" }}/home'
  environment:
    HOME: '{{ "{{" }} run_dir {{ "}}" }}/home'
  register: kind_create_result
