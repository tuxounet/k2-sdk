{{ $kubeconfig := .kubeconfig }}
{{ $namespace := .namespace }}

- name: "Create a k8s namespace {{ $namespace }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ $kubeconfig }}"
    state: present
    name: "{{ $namespace }}"
    api_version: v1
    kind: Namespace
    wait: true
    wait_timeout: 60
    
{{ range $key, $value := .templates }}
- name: "apply kube manifest {{ $key }}"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ $kubeconfig }}"
    namespace: "{{ $namespace }}"
    definition: {{ toRawJson  $value }}
    wait: true
    wait_timeout: 60
{{ end }}


