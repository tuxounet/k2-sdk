{{ $kubeconfig := .kubeconfig }}
{{ $namespace := .namespace }}
{{ $wait_timeout := .wait_timeout }}


- name: "Create a k8s namespace {{ $namespace }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ $kubeconfig }}"
    state: present
    name: "{{ $namespace }}"
    api_version: v1
    kind: Namespace
    wait: true
    wait_timeout: {{ $wait_timeout }}
    
{{ range $key, $value := .templates }}
- name: "apply kube manifest {{ $key }}"
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ $kubeconfig }}"
    namespace: "{{ $namespace }}"
    definition: {{ toRawJson  $value }}
    wait: true
    wait_timeout: {{ $wait_timeout }}
{{ end }}

{{ range $key, $value := .templates }}
{{- $kind := index $value "kind" -}}
{{- if or (eq $kind "Deployment") (eq $kind "StatefulSet") (eq $kind "DaemonSet") -}}
{{- $meta := index $value "metadata" -}}
{{- $name := index $meta "name" -}}
{{- $metaNs := index $meta "namespace" -}}
{{- $restartNs := default $namespace $metaNs -}}
- name: "rollout restart {{ $kind }}/{{ $name }} in {{ $restartNs }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ $kubeconfig }}"
    namespace: "{{ $restartNs }}"
    api_version: apps/v1
    kind: "{{ $kind }}"
    name: "{{ $name }}"
    state: present
    merge_type: strategic-merge
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ "{{" }} now(utc=true) {{ "}}" }}"
{{ end -}}
{{ end }}


