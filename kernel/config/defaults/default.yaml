host:
  address: 127.0.0.1
  ingress:
    address: 127.0.0.1
    port: 8080
    root: http://127.0.0.1:8080
    # tls:
    #   port: 8443
    #   cert: "etc/pki/ssl/s.sample.local.crt"
    #   key: "etc/pki/ssl/s.sample.local.key"
    auth:
      default_access: "public"
      public:
        enabled: true
      authenticated:
        enabled: false
        # login_url: "/auth/users/login"
        # verify_url: "/auth/users/verify"
        # redirect_param: "redirect"
  compute:
    enabled: true
    cache:
      ttl: 1440 # minutes (24 hours)
    containers:
      engine: podman
      port:
        start: 59000
        end: 59099
    kubernetes:
      embedded:
        enabled: true
        ports:
          http: 31480
          https: 31443
        networks:
          - subnet: 172.99.27.0/24
            gateway: 172.99.27.2
            iprange: 172.99.27.0/26
      port:
        start: 59100
        end: 59199
      kubeConfig: ""

      ingress:
        serviceNamespace: "kube-system"
        serviceName: "traefik"
        servicePort: 8000
