apiVersion: apps/v1
kind: Deployment
metadata:
  name: files-deployment
spec:
  selector:
    matchLabels:
      app: files-deployment
  replicas: 1
  template:
    metadata:
      labels:
        app: files-deployment
    spec:
      containers:
        - name: files-deployment
          image: filebrowser/filebrowser:latest
          ports:
            - containerPort: 80
          env:
            - name: "FB_BASEURL"
              value: "/"
            - name: "FB_NOAUTH"
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
