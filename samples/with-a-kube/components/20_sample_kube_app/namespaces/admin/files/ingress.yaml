apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: files-ingress
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: files-service
                port:
                  number: 80
  tls:
    - hosts:
        - localhost
      secretName: files-ingress-tls
