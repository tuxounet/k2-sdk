- block:
    - name: decrypt key
      become: true
      shell: |
        rm -f  {{ run_dir }}/etc/pki/ca/{{ site.tls.ca.domain }}.clear.key
        openssl rsa -in {{ run_dir }}/etc/pki/ca/{{ site.tls.ca.domain }}.key -out {{ run_dir }}/etc/pki/ca/{{ site.tls.ca.domain }}.clear.key -passin pass:{{ lookup('ansible.builtin.file', site.tls.paths.secrets + '/ca/' + site.tls.ca.domain + '.pwd') }}

    - name: read tls-key
      become: true
      slurp:
        src: "{{ run_dir }}/etc/pki/ca/{{ site.tls.ca.domain }}.clear.key"
      register: ca_key_body

    - name: cleanup
      become: true
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ run_dir }}/etc/pki/ca/{{ site.tls.ca.domain }}.clear.key"

    - name: "add ca secret"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ run_dir }}/home/.kube/config"
        namespace: "kube-system"
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ca-issuer-secret
            namespace: kube-system
          type: Opaque
          data:
            tls.key: "{{ ca_key_body.content }}"
            tls.crt: "{{ lookup('ansible.builtin.file', site.tls.paths.secrets + '/ca/' + site.tls.ca.domain + '.crt') | b64encode }}"
        wait: true
        wait_timeout: 60

    - name: "add ca issuer"
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ run_dir }}/home/.kube/config"
        namespace: "kube-system"
        definition:
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: ca-issuer
            namespace: kube-system
          spec:
            ca:
              secretName: ca-issuer-secret
        wait: true
        wait_timeout: 60
