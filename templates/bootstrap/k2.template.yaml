k2:
  metadata:
    id: k2.sdk.templates.bootstrap
    kind: "template"
  body:
    name: "bootstrao"
    parameters:
      name: "KNewApp"
      description: "Name of the new app"
      module: "my.git.host/my-app"
      version: "v0.0.1"
      components: site
      sdk_module: "github.com/tuxounet/k2-sdk"
      sdk_version: "v0.9.1"
    scripts:
      bootstrap:
        - go mod init {{ .module }}
        - go get -v {{ .sdk_module }}@{{ .sdk_version }}
        - go mod tidy
      post:
        - make prepare
